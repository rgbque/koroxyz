<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoroGold++</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      width: 330px;
      background: linear-gradient(145deg, #0a0a0d, #111117);
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-family: "Comic Sans MS", "Comic Relief", sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      text-align: center;
      background: linear-gradient(90deg, #9696ff, #4f4fff);
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }

    .section {
      background: #15151c;
      padding: 15px 18px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
    }

    .section h2 {
      font-family: "Comic Sans MS", "Comic Relief", sans-serif;
      font-size: 18px;
      margin: 0 0 8px;
      color: #b6b6ff;
    }

    .section p {
      font-size: 14px;
      color: #cacaca;
      line-height: 1.4;
    }

    #supportBtn {
      background: #6969ff;
      border: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      color: white;
      width: 100%;
      font-family: "Comic Sans MS", "Comic Relief", sans-serif;
      font-weight: bold;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    #supportBtn:hover {
      background: #5757e6;
      transform: scale(1.03);
    }

    .news-box {
      max-height: 140px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .news-item {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2b2b35;
    }

    .news-title {
      font-family: "Comic Sans MS", "Comic Relief", sans-serif;
      font-size: 15px;
      color: #c7c7ff;
      margin-bottom: 4px;
    }

    .news-text {
      font-size: 13px;
      color: #dcdcdc;
    }
  </style>
</head>

<body>
  <h1>KoroGold++</h1>

  <div class="section">
    <h2>Support</h2>
    <p>Your Support helps add more updates to KoroGold++.</p>
    <button id="supportBtn">Support Development</button>
  </div>

  <div class="section">
    <h2>Patch Notes / News</h2>
    <div class="news-box">
      <div class="news-item">
        <div class="news-title">Version 2.0 Released</div>
        <div class="news-text">Patched all bugs from Version 1.9!</div>
      </div>
    </div>
  </div>

  <!-- THIS IS THE IMPORTANT PART -->
  <script src="popup.js"></script>
</body>
</html>
